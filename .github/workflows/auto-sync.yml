name: Auto-Sync Backend

# 上游 kanoqwq/UFI-TOOLS 的后端更新时：自动同步后端代码（重放端口/包名定制），
# 构建 APK 并上传 Release。前端（app/frontEnd）为本仓库重写，永不从上游同步。
on:
  schedule:
    - cron: "23 16 * * *"   # 每天 00:23（北京时间）
  workflow_dispatch:
    inputs:
      publish:
        description: "无同步变更时也强制构建并发布 Release"
        type: boolean
        default: false
      tag:
        description: "自定义 Release tag（留空自动生成）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync backend from upstream
        id: sync
        run: |
          git remote add upstream https://github.com/kanoqwq/UFI-TOOLS.git
          git fetch --no-tags upstream http-server-version
          python3 tools/sync_backend.py --upstream-ref upstream/http-server-version --notes /tmp/sync_notes.md
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[auto-sync] 同步上游后端 @ $(git rev-parse --short upstream/http-server-version)"
            git push origin HEAD:http-server-version
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无后端变更，本次为手动强制构建。" > /tmp/sync_notes.md
          fi

      - name: Decide build
        id: decide
        run: |
          if [ "${{ steps.sync.outputs.changed }}" = "true" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rebuild ufi_req from source (linux/arm64)
        if: steps.decide.outputs.build == 'true'
        working-directory: app/src/main/assets/shell
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ufi_req ufi_req.go
          python3 -c "import struct;d=open('ufi_req','rb').read(20);assert d[:4]==b'\x7fELF' and struct.unpack('<H',d[18:20])[0]==0xb7,'not aarch64 ELF';print('ufi_req rebuilt: aarch64 ELF OK')"

      - name: Install Node.js dependencies
        if: steps.decide.outputs.build == 'true'
        working-directory: app/frontEnd
        run: npm install --no-package-lock

      - name: Build APK
        if: steps.decide.outputs.build == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Create Release with APK
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          NEWNAME="UFI-TOOLS_M3_V${VERSION}_$(date +%Y%m%d_%H%M).apk"
          cp "$APK" "$NEWNAME"
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="V${VERSION}-M3-auto-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          gh release create "$TAG" "$NEWNAME" --title "$TAG" --notes-file /tmp/sync_notes.md
          echo "Release $TAG 已发布（$NEWNAME）"
